<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Үнэ харах</title>
<style>
  /* Заалны таблетад зориулав: бараан дэвсгэр (гэрэл ойхгүй), том үсэг. */
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:#0b0b12;color:#fff;overflow:hidden;
    display:flex;flex-direction:column;
  }
  header{display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;background:#14141f;
    border-bottom:1px solid #24243a;flex-shrink:0}
  .dot{width:2rem;height:2rem;border-radius:.6rem;flex-shrink:0;
    background:linear-gradient(135deg,#8b5cf6,#d946ef);display:grid;place-items:center;font-size:1rem}
  header h1{font-size:1rem;font-weight:800;letter-spacing:-.01em}
  header p{font-size:.72rem;color:#8b8ba7;margin-top:.05rem}
  #kbd,#camsw{background:#1e1e2e;border:1px solid #33334d;color:#b9b9d0;
    border-radius:.6rem;padding:.4rem .7rem;font-size:.75rem;cursor:pointer}
  #camsw{margin-left:auto}

  main{flex:1;display:flex;min-height:0;gap:.6rem;padding:.6rem}
  @media (orientation:portrait){ main{flex-direction:column} }

  #camwrap{position:relative;background:#000;border-radius:1rem;overflow:hidden;flex-shrink:0}
  @media (orientation:landscape){ #camwrap{width:40%;height:100%} }
  @media (orientation:portrait){ #camwrap{width:100%;height:42%} }
  #cam video,#cam canvas{width:100%!important;height:100%!important;object-fit:cover}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #cam{position:absolute;inset:0}
  #frame{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
  #frame div{width:74%;max-width:19rem;height:38%;border:3px solid #a78bfa;border-radius:1rem;
    box-shadow:0 0 0 9999px rgba(0,0,0,.45)}
  #camnote{position:absolute;bottom:.5rem;left:0;right:0;text-align:center;
    font-size:.72rem;color:rgba(255,255,255,.65)}
  #caminfo{position:absolute;top:.4rem;left:.5rem;font-size:.62rem;color:rgba(255,255,255,.45)}
  #zoom{position:absolute;top:.4rem;right:.5rem;display:flex;align-items:center;gap:.3rem;
    background:rgba(0,0,0,.45);border-radius:999px;padding:.15rem .3rem}
  #zoom button{width:1.9rem;height:1.9rem;border-radius:999px;border:0;background:#7c3aed;
    color:#fff;font-size:1.1rem;line-height:1;cursor:pointer}
  #zoom span{font-size:.72rem;color:#fff;min-width:2.6rem;text-align:center}
  #camerr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:.7rem;background:#fff;color:#333;padding:1.2rem;text-align:center}
  #camerr b{font-size:.95rem}#camerr span{font-size:.78rem;color:#666;line-height:1.5}
  #camerr button{background:#7c3aed;color:#fff;border:0;border-radius:.6rem;
    padding:.5rem 1rem;font-size:.8rem;font-weight:700;cursor:pointer}

  #panel{flex:1;min-width:0;min-height:0;border-radius:1rem;background:#14141f;
    border:1px solid #24243a;display:flex;flex-direction:column;justify-content:center;
    align-items:center;padding:1rem;text-align:center;overflow:hidden}
  .idle{color:#6f6f8c;font-size:1.05rem;font-weight:700}
  .idle small{display:block;margin-top:.4rem;font-size:.8rem;font-weight:400;color:#4d4d66}

  #pname{font-size:clamp(1.1rem,3.6vw,2rem);font-weight:800;line-height:1.25;
    max-height:4.6em;overflow:hidden}
  #pmeta{margin-top:.5rem;display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;
    font-size:.78rem;color:#8b8ba7}
  #pmeta .chip{background:#1e1e2e;border:1px solid #33334d;border-radius:999px;
    padding:.15rem .6rem;font-family:ui-monospace,monospace;color:#c9c9e0}
  #plabel{margin-top:1.1rem;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
    color:#a78bfa;font-weight:700}
  #pprice{font-size:clamp(3rem,13vw,6.5rem);font-weight:900;line-height:1;
    letter-spacing:-.03em;color:#c4b5fd}
  #pprice span{font-size:.42em;font-weight:800;margin-left:.1em}
  #pbulk{margin-top:.55rem;font-size:1rem;color:#7d7d9c;min-height:1.5rem}
  #pbulk b{font-size:1.4rem;font-weight:800;color:#6ee7b7}
  #pact{margin-top:1rem;display:flex;gap:.4rem;align-items:center;justify-content:center}
  #pact button{background:#7c3aed;color:#fff;border:0;border-radius:.7rem;
    padding:.6rem 1.1rem;font-size:.9rem;font-weight:800;cursor:pointer}
  #pact select{background:#1e1e2e;border:1px solid #33334d;color:#e5e5f0;
    border-radius:.7rem;padding:.55rem .5rem;font-size:.85rem}
  #pbar{margin-top:.9rem;font-family:ui-monospace,monospace;font-size:.7rem;color:#4d4d66}

  .miss b{font-size:1.25rem;color:#fbbf24}
  .miss code{display:block;margin-top:.4rem;font-family:ui-monospace,monospace;
    font-size:.85rem;color:#8b8ba7}
  #others{margin-top:.9rem;width:100%;max-width:32rem;display:flex;flex-direction:column;gap:.3rem}
  #others button{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;
    background:#1e1e2e;border:1px solid #33334d;color:#e5e5f0;border-radius:.7rem;
    padding:.5rem .7rem;font-size:.82rem;cursor:pointer}
  #others .c{font-family:ui-monospace,monospace;font-size:.7rem;color:#8b8ba7}
  #others .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #others .p{font-family:ui-monospace,monospace;font-weight:800;color:#c4b5fd}

  #manual{display:none;gap:.4rem;padding:.6rem 1rem;background:#14141f;
    border-bottom:1px solid #24243a;flex-shrink:0}
  #manual input{flex:1;background:#0b0b12;border:1px solid #33334d;color:#fff;
    border-radius:.6rem;padding:.55rem .8rem;font-size:.9rem;outline:none}
  #manual input:focus{border-color:#7c3aed}
  #manual button{background:#7c3aed;color:#fff;border:0;border-radius:.6rem;
    padding:.55rem 1rem;font-size:.85rem;font-weight:700;cursor:pointer}
  #spin{position:absolute;top:.5rem;right:.5rem;width:1.4rem;height:1.4rem;display:none;
    border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;
    animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header>
  <div class="dot">🏷️</div>
  <div>
    <h1>Үнэ харах</h1>
    <p>Барааны баркодыг камерт уншуулна уу</p>
  </div>
  <button id="camsw" title="Урд/хойд камер солих">Камер: нүүрний</button>
  <button id="kbd">Гараар</button>
</header>

<div id="manual">
  <input id="mq" placeholder="Баркод, код эсвэл нэр…" autocomplete="off">
  <button id="mgo">Хайх</button>
</div>

<main>
  <div id="camwrap">
    <video id="v" playsinline muted autoplay></video>
    <div id="cam"></div>
    <div id="frame"><div></div></div>
    <div id="camnote">Баркодыг рамкан дотор барина</div>
    <div id="caminfo"></div>
    <div id="zoom" style="display:none">
      <button id="zm" title="Холдуулах">−</button>
      <span id="zv">1.0×</span>
      <button id="zp" title="Ойртуулах">+</button>
    </div>
    <div id="spin"></div>
    <div id="camerr">
      <b>Камер нээгдсэнгүй</b>
      <span id="camerrmsg"></span>
      <button id="retry">Дахин оролдох</button>
    </div>
  </div>

  <div id="panel">
    <div class="idle">Баркодыг уншуулна уу
      <small>эсвэл дээрх «Гараар» товчийг дарна уу</small>
    </div>
  </div>
</main>

<script>
(function () {
  "use strict";
  var REPEAT_MS = 2500;      // ижил баркодыг дахин асуухгүй
  var CLEAR_MS  = 30000;     // үр дүнг автоматаар цэвэрлэх
  var FORMATS = ["ean_13","ean_8","code_128","code_39","code_93","upc_a","upc_e","itf","codabar"];

  // Скáннер бүр Enter-ийг өөрөөр илгээдэг (Enter / Return / keyCode 13),
  // тиймээс гурвуулангаар нь шалгана.
  function isEnter(e) {
    return e.key === "Enter" || e.key === "Return" || e.keyCode === 13 || e.which === 13;
  }

  var panel = document.getElementById("panel");
  var spin  = document.getElementById("spin");
  var last = { code: "", at: 0 }, clearT = null, buf = { s: "", at: 0 };

  function money(n) {
    if (n === null || n === undefined) return "—";
    return Math.round(n).toLocaleString("mn-MN");
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function idle() {
    panel.innerHTML = '<div class="idle">Баркодыг уншуулна уу'
      + '<small>эсвэл дээрх «Гараар» товчийг дарна уу</small></div>';
  }

  function render(r) {
    var p = r.product;
    if (p) {
      panel.innerHTML =
        '<div id="pname">' + esc(p.name) + '</div>'
        + '<div id="pmeta"><span class="chip">' + esc(p.code) + '</span>'
        + (p.uom ? '<span>' + esc(p.uom) + '</span>' : '')
        + (p.category ? '<span>· ' + esc(p.category) + '</span>' : '')
        + '</div>'
        + '<div id="plabel">Зарах үнэ</div>'
        + '<div id="pprice">' + money(p.price) + '<span>₮</span></div>'
        + '<div id="pbulk"></div>'
        + '<div id="pact"><button id="prn">Шошго хэвлэх</button>'
        + '<select id="pcopies"><option value="1">1 ш</option>'
        + '<option value="2">2 ш</option><option value="4">4 ш</option>'
        + '<option value="8">8 ш</option></select></div>'
        + (p.barcodes && p.barcodes.length
            ? '<div id="pbar">' + esc(p.barcodes.slice(0, 3).join(" · ")) + '</div>' : '');
      loadBulk(p.code);
      // innerHTML дахин зурагдах бүрд товч шинэ элемент болдог тул энд холбоно.
      panel.querySelector("#prn").addEventListener("click", function () {
        var n = (panel.querySelector("#pcopies") || {}).value || "1";
        // Сервер юу ч хэвлэхгүй — шинэ цонх нээгдэж хэвлэгчийн харилцах цонх гарна.
        window.open("label?q=" + encodeURIComponent(p.code) + "&copies=" + n, "_blank");
      });
      return;
    }
    var h = '<div class="miss"><b>Бараа олдсонгүй</b><code>' + esc(r.query) + '</code></div>';
    if (r.error) h += '<div style="margin-top:.5rem;font-size:.78rem;color:#f87171">' + esc(r.error) + '</div>';
    if (r.others && r.others.length) {
      h += '<div id="others">';
      r.others.slice(0, 5).forEach(function (o) {
        h += '<button data-code="' + esc(o.code) + '"><span class="c">' + esc(o.code)
          + '</span><span class="n">' + esc(o.name) + '</span><span class="p">'
          + money(o.price) + '₮</span></button>';
      });
      h += '</div>';
    }
    panel.innerHTML = h;
    Array.prototype.forEach.call(panel.querySelectorAll("#others button"), function (b) {
      b.addEventListener("click", function () { lookup(b.getAttribute("data-code")); });
    });
  }

  // Бөөний үнэ erxes-ээс ирдэг тул удаан (0.6-1.6 сек). Үндсэн үнийг
  // хүлээлгэхгүйн тулд тусад нь ард нь ачаална. Энэ хооронд өөр бараа
  // уншуулсан бол хариуг нь хаяна.
  // АНХААР: last.code нь уншуулсан БАРКОД (жишээ 4780021280686), харин энд
  // барааны КОД (204300) ирдэг. Тэр хоёрыг харьцуулбал бөөний үнэ хэзээ ч
  // харагдахгүй байсан → одоо сүүлд зурагдсан барааны кодоор шалгана.
  var shownCode = "";
  function loadBulk(code) {
    var box = panel.querySelector("#pbulk");
    if (!box) return;
    shownCode = code;
    box.textContent = "…";
    fetch("bulk?q=" + encodeURIComponent(code), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (b) {
        if (shownCode !== code) return;                 // өөр бараа уншуулсан
        var cur = panel.querySelector("#pbulk");
        if (!cur) return;
        cur.innerHTML = (b && b.ok)
          ? 'Бөөний <b>' + esc(b.quantity) + ' ш</b> — <b>' + esc(b.price) + '₮</b>'
          : "";
      })
      .catch(function () {
        var cur = panel.querySelector("#pbulk");
        if (cur) cur.textContent = "";
      });
  }

  function lookup(code) {
    var c = String(code || "").trim();
    if (!c) return;
    var now = Date.now();
    if (c === last.code && now - last.at < REPEAT_MS) return;
    last = { code: c, at: now };
    try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) {}
    spin.style.display = "block";
    fetch("lookup?q=" + encodeURIComponent(c), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(render)
      .catch(function () {
        render({ query: c, product: null, others: [], error: "Сервертэй холбогдож чадсангүй" });
      })
      .then(function () {
        spin.style.display = "none";
        if (clearT) clearTimeout(clearT);
        clearT = setTimeout(idle, CLEAR_MS);
      });
  }

  /* ── Камер: тасралтгүй уншина (нэг уншаад ЗОГСОХГҮЙ) ── */
  var video = document.getElementById("v"), det = null, raf = null, qr = null, stream = null;

  function camFail(msg) {
    document.getElementById("camerrmsg").textContent = msg;
    document.getElementById("camerr").style.display = "flex";
    document.getElementById("camnote").style.display = "none";
    document.getElementById("frame").style.display = "none";
  }
  function loop() {
    if (video && det) {
      det.detect(video).then(function (codes) {
        if (codes && codes[0]) lookup(codes[0].rawValue || codes[0].value);
      }).catch(function () {});
    }
    raf = requestAnimationFrame(loop);
  }
  function loadScript(src) {
    return new Promise(function (ok, no) {
      var s = document.createElement("script");
      s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s);
    });
  }
  /* Аль камер: "user" = нүүрний (урд), "environment" = хойд. Заалны таблет
     үйлчлүүлэгч рүү харсан байрладаг тул анхдагч нь НҮҮРНИЙ камер;
     сонголт localStorage-д хадгалагдаж, дараа нээхэд хэвээр байна. */
  var FACING_KEY = "kiosk_cam_facing";
  function facing() {
    try { return localStorage.getItem(FACING_KEY) || "user"; } catch (e) { return "user"; }
  }
  function facingLabel() { return "Камер: " + (facing() === "user" ? "нүүрний" : "хойд"); }
  document.getElementById("camsw").textContent = facingLabel();
  document.getElementById("camsw").addEventListener("click", function () {
    try { localStorage.setItem(FACING_KEY, facing() === "user" ? "environment" : "user"); } catch (e) {}
    document.getElementById("camsw").textContent = facingLabel();
    if (qr) { try { qr.stop(); } catch (e) {} try { qr.clear(); } catch (e) {} qr = null; video.style.display = ""; }
    startCam();
  });

  /* Фокус/нягтрал/зүүм тохируулга. Хатуу фокустой (fixed-focus) урд камерт
     фокус тохируулж чадахгүй — тэр үед зүүм (дэмжвэл) л тусална: баркодыг
     рамкан дотор томруулж, шийдэх нягтрал сайжирна. */
  var ZOOM_KEY = "kiosk_cam_zoom", curTrack = null, zoomCap = null;
  function tuneTrack(track) {
    curTrack = track; zoomCap = null;
    var info = document.getElementById("caminfo"), zbox = document.getElementById("zoom");
    zbox.style.display = "none";
    if (!track) { info.textContent = ""; return; }
    var caps = {};
    try { caps = track.getCapabilities ? track.getCapabilities() : {}; } catch (e) {}
    var adv = [];
    if (caps.focusMode && caps.focusMode.indexOf("continuous") >= 0) adv.push({ focusMode: "continuous" });
    if (caps.exposureMode && caps.exposureMode.indexOf("continuous") >= 0) adv.push({ exposureMode: "continuous" });
    if (caps.whiteBalanceMode && caps.whiteBalanceMode.indexOf("continuous") >= 0) adv.push({ whiteBalanceMode: "continuous" });
    if (adv.length) { try { track.applyConstraints({ advanced: adv }).catch(function () {}); } catch (e) {} }
    if (caps.zoom && caps.zoom.max > caps.zoom.min) {
      zoomCap = caps.zoom;
      var saved = parseFloat((function () { try { return localStorage.getItem(ZOOM_KEY); } catch (e) { return ""; } })() || "");
      setZoom(isFinite(saved) && saved ? saved : Math.min(zoomCap.max, Math.max(zoomCap.min, 1.5)));
      zbox.style.display = "flex";
    }
    var st = {}; try { st = track.getSettings ? track.getSettings() : {}; } catch (e) {}
    var fm = st.focusMode || (caps.focusMode ? caps.focusMode.join("/") : "");
    info.textContent = (st.width && st.height ? st.width + "×" + st.height : "")
      + (fm ? " · фокус: " + (fm === "continuous" ? "авто" : fm) : " · фокус: тогтмол")
      + (zoomCap ? " · зүүм" : "");
  }
  function setZoom(z) {
    if (!curTrack || !zoomCap) return;
    z = Math.round(Math.min(zoomCap.max, Math.max(zoomCap.min, z)) * 10) / 10;
    try { curTrack.applyConstraints({ advanced: [{ zoom: z }] }).catch(function () {}); } catch (e) {}
    document.getElementById("zv").textContent = z.toFixed(1) + "×";
    try { localStorage.setItem(ZOOM_KEY, String(z)); } catch (e) {}
  }
  function curZoom() { var t = parseFloat(document.getElementById("zv").textContent); return isFinite(t) ? t : 1; }
  document.getElementById("zp").addEventListener("click", function () { setZoom(curZoom() + (zoomCap ? Math.max(0.5, (zoomCap.step || 0.5)) : 0.5)); });
  document.getElementById("zm").addEventListener("click", function () { setZoom(curZoom() - (zoomCap ? Math.max(0.5, (zoomCap.step || 0.5)) : 0.5)); });

  function startCam() {
    document.getElementById("camerr").style.display = "none";
    document.getElementById("camnote").style.display = "";
    document.getElementById("frame").style.display = "";
    if (raf) cancelAnimationFrame(raf);
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      camFail("Энэ хөтөч дээр камерын API байхгүй. HTTPS хаягаар нэвтэрсэн эсэхээ шалгана уу.");
      return;
    }
    var want = facing();
    // Аль болох ӨНДӨР нягтрал хүснэ (баркод жижиг тул 640×480 хангалтгүй).
    // Камер дэмжихгүй бол хөтөч хамгийн ойрыг өгнө; бүр болохгүй бол энгийнээр.
    var hi = { facingMode: { ideal: want }, width: { ideal: 1920 }, height: { ideal: 1080 },
               frameRate: { ideal: 30 } };
    navigator.mediaDevices.getUserMedia({ video: hi, audio: false })
      .catch(function () { return navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: want } }, audio: false }); })
      .catch(function () { return navigator.mediaDevices.getUserMedia({ video: true, audio: false }); })
      .then(function (s) {
        stream = s;
        tuneTrack(s.getVideoTracks()[0]);
        if ("BarcodeDetector" in window) {
          return window.BarcodeDetector.getSupportedFormats()
            .catch(function () { return FORMATS; })
            .then(function (sup) {
              var f = FORMATS.filter(function (x) { return sup.indexOf(x) >= 0; });
              det = new window.BarcodeDetector({ formats: f.length ? f : FORMATS });
              video.srcObject = s;
              return video.play().catch(function () {});
            })
            .then(function () { raf = requestAnimationFrame(loop); });
        }
        // Нөөц: html5-qrcode (өөрийн stream үүсгэдэг тул энэийг чөлөөлнө)
        s.getTracks().forEach(function (t) { t.stop(); });
        stream = null; video.style.display = "none";
        return loadScript("vendor/html5-qrcode.min.js").then(function () {
          if (!window.Html5Qrcode) throw new Error("Камерын сан ачаалагдсангүй");
          return window.Html5Qrcode.getCameras();
        }).then(function (devs) {
          if (!devs || !devs.length) throw new Error("Камер олдсонгүй");
          var re = want === "user" ? /front|user|face|selfie/i : /back|rear|environment/i;
          var pick = devs.filter(function (d) { return re.test(d.label || ""); })[0];
          qr = new window.Html5Qrcode("cam", false);
          return qr.start(pick ? pick.id : { facingMode: want },
            { fps: 15, qrbox: { width: 320, height: 200 }, aspectRatio: 1.4,
              videoConstraints: { facingMode: want, width: { ideal: 1920 }, height: { ideal: 1080 },
                                  advanced: [{ focusMode: "continuous" }] } },
            function (t) { lookup(t); }, function () {}).then(function () {
              try {
                var vv = document.querySelector("#cam video");
                if (vv && vv.srcObject) tuneTrack(vv.srcObject.getVideoTracks()[0]);
              } catch (e) {}
            });
        });
      })
      .catch(function (e) {
        var n = (e && e.name) || "";
        camFail(
          n === "NotAllowedError" ? "Камер зөвшөөрөгдөөгүй. Хөтчийн тохиргооноос энэ хаягт камер зөвшөөрнө үү."
          : n === "NotFoundError" ? "Камер олдсонгүй."
          : n === "NotReadableError" ? "Камерыг өөр програм ашиглаж байна."
          : ((e && e.message) || "Тодорхойгүй алдаа"));
      });
  }
  document.getElementById("retry").addEventListener("click", startCam);

  /* ── USB / Bluetooth скáннер (гар шиг бичээд Enter дардаг) ── */
  document.addEventListener("keydown", function (e) {
    if (document.getElementById("manual").style.display === "flex") return;
    var now = Date.now();
    if (now - buf.at > 120) buf.s = "";     // хүн бичсэн бол хаяна
    buf.at = now;
    if (isEnter(e)) { var s = buf.s; buf.s = ""; if (s.length >= 4) lookup(s); }
    else if (e.key.length === 1) buf.s += e.key;
  });

  /* ── Гараар оруулах ── */
  var man = document.getElementById("manual"), mq = document.getElementById("mq");
  document.getElementById("kbd").addEventListener("click", function () {
    var on = man.style.display === "flex";
    man.style.display = on ? "none" : "flex";
    if (!on) mq.focus();
  });
  function go() { lookup(mq.value); mq.value = ""; }
  document.getElementById("mgo").addEventListener("click", go);
  mq.addEventListener("keydown", function (e) { if (isEnter(e)) { e.preventDefault(); go(); } });

  /* ── Дэлгэц унтрахаас сэргийлнэ (дэмждэг бол) ── */
  function wake() {
    if (!navigator.wakeLock) return;
    navigator.wakeLock.request("screen").catch(function () {});
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") wake();
  });

  startCam(); wake();
})();
</script>
</body>
</html>
